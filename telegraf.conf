[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "network-monitoring"

# UDP Input - Receive DNS events from router
[[inputs.socket_listener]]
  service_address = "udp://:8094"
  data_format = "influx"
  read_buffer_size = "64MB"

# Opportunistic CDN pinging - only when streaming devices are active
[[inputs.execd]]
  command = ["python3", "/scripts/streaming-ping-orchestrator.py"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"

# Infrastructure monitoring - Router health
[[inputs.ping]]
  interval = "15s"
  urls = [
    "192.168.1.2",    # GLMT2500A (OpenWrt router)
    "192.168.2.1"     # Starlink router
  ]
  count = 3
  ping_interval = 0.2
  timeout = 3.0
  method = "native"
  [inputs.ping.tags]
    type = "infrastructure"

# Starlink Dishy detailed monitoring - more frequent for throttle detection
[[inputs.ping]]
  interval = "10s"
  urls = [
    "192.168.100.1",  # Starlink Dishy
  ]
  count = 5
  ping_interval = 0.1
  timeout = 2.0
  method = "native"
  [inputs.ping.tags]
    type = "starlink_dishy"

# Starlink Dishy HTTP health check
[[inputs.http_response]]
  interval = "30s"
  urls = ["http://192.168.100.1/"]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = true
  [inputs.http_response.tags]
    type = "starlink_dishy"

# WAN health monitoring - Internet connectivity
[[inputs.ping]]
  interval = "30s"
  urls = [
    "8.8.8.8",        # Google DNS
    "1.1.1.1",        # Cloudflare DNS
  ]
  count = 5
  ping_interval = 0.5
  timeout = 5.0
  method = "native"
  [inputs.ping.tags]
    type = "wan_health"

# DNS query timing for streaming services
[[inputs.dns_query]]
  interval = "30s"
  servers = ["192.168.1.2"]
  domains = [
    "www.netflix.com",
    "youtube.com",
    "primevideo.com",
    "disneyplus.com"
  ]
  record_type = "A"
  timeout = 5

# Router health metrics - scrape prometheus-node-exporter-lua
# Note: This uses Prometheus format but stores in InfluxDB (Pure InfluxDB architecture)
[[inputs.prometheus]]
  urls = ["http://192.168.1.2:9100/metrics"]
  interval = "60s"
  metric_version = 2

  # Rename to match dashboard queries
  name_override = "router_stats"

  [inputs.prometheus.tags]
    device = "glmt2500a"
    location = "network-core"
    host = "network-monitoring"

# DNS query collection - DISABLED due to 407% CPU spike
# [[inputs.exec]]
#   commands = ["python3 /scripts/dns-collector.py"]
#   interval = "60s"
#   timeout = "30s"
#   data_format = "influx"

# DNS via syslog - receive forwarded dnsmasq logs from router
[[inputs.syslog]]
  server = "udp://:514"

# DHCP monitoring - unified router collector framework
[[inputs.exec]]
  commands = ["python3 /scripts/router_collector.py"]
  interval = "60s"
  timeout = "30s"
  data_format = "influx"
  [inputs.exec.tags]
    collector = "router"

# Monitor Mac Mini host resources
[[inputs.cpu]]
  interval = "60s"
  percpu = false
  totalcpu = true

[[inputs.mem]]
  interval = "60s"

[[inputs.disk]]
  interval = "300s"
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Output to InfluxDB v2
[[outputs.influxdb_v2]]
